<app-page-header title="My Profile" subtitle="Update your personal information." />

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-5xl">
  <!-- Avatar -->
  <div class="bg-surface-container-lowest rounded-2xl shadow-custom p-6 text-center">
    <div class="w-24 h-24 rounded-full bg-brand-orange text-white text-3xl font-extrabold flex items-center justify-center mx-auto mb-4 overflow-hidden">
      @if (avatarUrl(); as url) {
        <img [src]="url" [alt]="form.controls.firstName.value" class="w-full h-full object-cover" />
      } @else {
        {{ (form.controls.firstName.value || 'U')[0] }}
      }
    </div>
    <h3 class="font-bold text-brand-navy">
      {{ form.controls.firstName.value }} {{ form.controls.lastName.value }}
    </h3>
    <p class="text-sm text-secondary mb-4">{{ form.controls.email.value }}</p>
    <app-file-upload
      accept="image/*"
      [multiple]="false"
      (filesSelected)="onAvatarSelected($event)"
    />
  </div>

  <!-- Details form -->
  <form [formGroup]="form" (ngSubmit)="save()" class="lg:col-span-2 bg-surface-container-lowest rounded-2xl shadow-custom p-6">
    <app-validation-summary [form]="form" [show]="form.touched" />

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-brand-navy">First Name</label>
        <input formControlName="firstName" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant outline-none focus:border-brand-orange focus:ring-2 focus:ring-brand-orange/20" />
      </div>
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-brand-navy">Last Name</label>
        <input formControlName="lastName" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant outline-none focus:border-brand-orange focus:ring-2 focus:ring-brand-orange/20" />
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-brand-navy">Email</label>
        <input formControlName="email" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container-low outline-none" />
      </div>
      <div class="space-y-1.5">
        <label class="text-sm font-semibold text-brand-navy">Phone</label>
        <input formControlName="phoneNumber" placeholder="+44…" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant outline-none focus:border-brand-orange focus:ring-2 focus:ring-brand-orange/20" />
      </div>
    </div>

    <div class="space-y-1.5 mt-4">
      <label class="text-sm font-semibold text-brand-navy">Bio</label>
      <textarea formControlName="bio" rows="4" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant outline-none focus:border-brand-orange focus:ring-2 focus:ring-brand-orange/20"></textarea>
    </div>

    <div class="flex justify-end mt-6">
      <button
        type="submit"
        [disabled]="!canSave()"
        class="bg-brand-orange text-white px-6 py-2.5 rounded-lg font-bold soft-shadow-hover disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Save Changes
      </button>
    </div>
  </form>
</div>
