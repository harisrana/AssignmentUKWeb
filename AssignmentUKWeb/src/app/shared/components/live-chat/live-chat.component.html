@if (open()) {
  <div class="fixed bottom-40 right-6 z-50 w-[calc(100vw-3rem)] max-w-sm rounded-2xl bg-white shadow-2xl border border-outline-variant/20 flex flex-col overflow-hidden">
    <div class="bg-brand-navy text-white px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-green-400"></span>
        <span class="font-bold text-sm">Live Chat</span>
      </div>
      <button type="button" (click)="open.set(false)" aria-label="Close chat" class="hover:text-brand-orange transition-colors">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>

    <div class="flex-1 max-h-80 overflow-y-auto p-4 space-y-3 bg-surface-container-low">
      @if (connecting()) {
        <p class="text-xs text-secondary text-center">Connecting…</p>
      }
      @for (message of messages(); track message.id) {
        <div class="flex" [class.justify-end]="message.senderType === 'Visitor'">
          <div
            class="max-w-[80%] rounded-xl px-3 py-2 text-sm"
            [class.bg-brand-orange]="message.senderType === 'Visitor'"
            [class.text-white]="message.senderType === 'Visitor'"
            [class.bg-white]="message.senderType === 'Agent'"
            [class.text-brand-navy]="message.senderType === 'Agent'"
            [class.shadow-custom]="message.senderType === 'Agent'"
          >{{ message.text }}</div>
        </div>
      }
    </div>

    <form (ngSubmit)="send()" class="flex items-center gap-2 p-3 border-t border-outline-variant/20">
      <input
        type="text"
        [(ngModel)]="draft"
        name="draft"
        placeholder="Type a message…"
        class="flex-1 bg-surface-container-low border border-outline-variant/30 rounded-full px-4 py-2 text-sm text-brand-navy outline-none focus:ring-2 focus:ring-brand-orange"
      />
      <button
        type="submit"
        [disabled]="!draft().trim()"
        aria-label="Send message"
        class="w-9 h-9 rounded-full bg-brand-orange text-white flex items-center justify-center disabled:opacity-40 hover:scale-105 transition-transform"
      >
        <span class="material-symbols-outlined text-lg">send</span>
      </button>
    </form>
  </div>
}

<button
  type="button"
  (click)="toggle()"
  aria-label="Open live chat"
  class="fixed bottom-6 right-6 z-50 w-14 h-14 rounded-full bg-brand-navy text-white flex items-center justify-center shadow-custom-hover hover:scale-110 transition-transform"
>
  <span class="material-symbols-outlined text-3xl">{{ open() ? 'expand_more' : 'chat' }}</span>
</button>
